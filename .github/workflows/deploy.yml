name: Deploy CryptoPulse to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptopulse-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.134.0"

jobs:
  deploy-edge:
    name: Deploy Telegram Edge Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Typecheck Node application
        run: npm run check

      - name: Validate Edge Worker
        run: npx wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run --config wrangler.toml

      - name: Deploy Edge Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          command: deploy --config wrangler.toml

  deploy-mini-app:
    name: Deploy Next.js Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    needs: deploy-edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Mini App dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build Mini App for Cloudflare
        working-directory: apps/web
        run: npm run build:edge

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Deploy Mini App
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          packageManager: npm
          workingDirectory: apps/web
          command: deploy --config wrangler.toml
