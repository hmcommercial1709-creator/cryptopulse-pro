name: CryptoPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cryptopulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.134.0"

jobs:
  validate:
    name: Validate Bot + Edge + Mini App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck bot
        run: npm run check

      - name: Test bot
        run: npm test

      - name: Validate Edge Worker
        run: npx wrangler@${{ env.WRANGLER_VERSION }} deploy --dry-run --config wrangler.toml

      - name: Install Mini App dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Build Mini App for Cloudflare
        working-directory: apps/web
        run: npm run build:edge
